name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      # Save built files as artifact
      - name: Upload built files
        uses: actions/upload-artifact@v4
        with:
          name: built-files
          path: |
            locales
            dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout repo (with push access)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Download dist
      uses: actions/download-artifact@v4
      with:
        name: built-files
        path: .

    - name: Deploy to develop-builds
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Backup built files
        rm -rf /tmp/build
        mkdir -p /tmp/build
        cp -r dist /tmp/build/ || true
        cp -r locales /tmp/build/ || true

        # Fetch all branches
        git fetch origin

        # Checkout or create develop-builds based on develop
        if git show-ref --verify --quiet refs/remotes/origin/develop-builds; then
          git checkout develop-builds
          git pull origin develop-builds
        else
          git checkout -b develop-builds origin/develop
        fi

        # Sync code with develop
        git merge origin/develop --no-edit

        # Replace built files
        rm -rf dist locales
        mkdir dist locales
        cp -r /tmp/build/dist/* dist/ || true
        cp -r /tmp/build/locales/* locales/ || true

        # Force add all built files (ignore .gitignore)
        git add -f dist
        git add -f locales

        # Commit if changed
        git commit -m "chore: update built files from develop" || echo "No changes"

        # Push
        git push origin develop-builds